services:
  atoll:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8450}:${PORT:-8450}"
    environment:
      ATOLL_SECRETS_KEY: ${ATOLL_SECRETS_KEY:?Define ATOLL_SECRETS_KEY in your local .env before starting Docker Compose}
      HOST: 0.0.0.0
      PORT: ${PORT:-8450}
      CONTAINER_CLI: docker
      ATOLL_STATE_FILE: /var/lib/atoll/atoll-state.json
      ATOLL_DATA_DIR: /var/lib/atoll
      RUNTIME_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-atoll}-runtime
      RUNTIME_ALLOW_PUBLIC_BIND: "false"
      RUNTIME_STARTUP_VALIDATION: warn
    volumes:
      - atoll_data:/var/lib/atoll
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - atoll-network

volumes:
  atoll_data:

networks:
  atoll-network:
    name: ${COMPOSE_PROJECT_NAME:-atoll}-runtime
