name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          ROLLUP_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/rollup'].version")
          SWC_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@swc/core'].version")
          npm install --no-save "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}" "@swc/core-linux-x64-gnu@${SWC_VERSION}"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build control plane and API
        run: npm run build

      - name: Build landing page
        run: npm run build:landing
